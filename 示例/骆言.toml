# 骆言包管理示例配置文件
# 这是骆言项目的包配置文件，包含项目信息、依赖管理和构建配置

[包信息]
名称 = "骆言包管理示例"
版本 = "1.0.0"
描述 = "展示骆言包管理系统功能的示例项目"
作者 = ["骆言开发团队", "Whisky PR Worker"]
许可证 = "MIT"
主页 = "https://github.com/UltimatePea/chinese-ocaml"

[依赖]
# 核心依赖包
标准库 = "^2.0.0"
数学工具包 = "1.5.2"
字符串处理 = ">=1.0.0"
文件系统工具 = "^1.2.0"

# 可选依赖
诗词处理 = "1.3.0"
网络通信 = "~2.1.0"

[开发依赖]
# 测试和构建工具
测试框架 = "^0.8.0"
基准测试 = "0.5.1"
代码格式化 = "latest"
文档生成器 = "^1.0.0"

[构建]
构建脚本 = "dune build"
测试脚本 = "dune runtest"
清理脚本 = "dune clean"
文档脚本 = "dune build @doc"

[发布]
排除文件 = [
    "*.tmp",
    "测试数据/*",
    ".git/*",
    "_build/*"
]
包含文件 = [
    "标准库/*.ly",
    "示例/*.ly",
    "文档/*.md"
]

[脚本]
# 自定义脚本命令
初始化 = "echo '项目初始化完成'"
部署 = "echo '开始部署到生产环境'"
备份 = "tar -czf backup.tar.gz 标准库/ 示例/"

[元数据]
# 包的元信息
关键词 = ["中文编程", "函数式", "诗意编程", "包管理"]
分类 = "编程语言"
最小骆言版本 = "1.0.0"
操作系统 = ["linux", "macos", "windows"]
架构 = ["x86_64", "arm64"]

# 仓库信息
[仓库]
类型 = "git"
地址 = "https://github.com/UltimatePea/chinese-ocaml.git"
分支 = "main"
标签 = "v1.0.0"